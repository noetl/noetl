[project]
name = "noetl"
version = "4.26.1"
description = "A framework to build and run data pipelines and workflows."
authors = [
    { name = "Kadyapam", email = "182583029+kadyapam@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "etl",
    "ml",
    "ops",
    "cleansing",
    "data",
    "pipeline",
    "workflow",
    "automation",
]
# ⚠⚠ THIS FILE IS NOT A DISTRIBUTION. It exists so semantic-release can carry a
# version: .releaserc.json runs `uv version ${nextRelease.version}` as its
# prepareCmd and commits pyproject.toml + uv.lock. Nothing builds or publishes it.
#
# The PyPI `noetl` identity is the maturin CLI wheel under packaging/pypi/, which
# has its OWN pyproject.toml, its own version (5.0.0), no runtime dependencies, and
# is the only thing .github/workflows/pypi.yml builds. Do not `pip install .` from
# this directory: it would produce an empty wheel named `noetl` that shadows the
# real CLI.
#
# The Python platform this repo once shipped is GONE (ai-meta#201 retired it;
# ai-meta#382 removed the residue). What remains beside the wrapper:
#   * noetl/database/ddl/postgres/schema_ddl.sql -- SQL, not Python. LIVE: the
#     ops deploy reads it BY PATH (automation/development/noetl.yaml,
#     automation/gcp_gke/noetl_gke_fresh_stack.yaml) and repos/server keeps a
#     destination copy that cites it.
#   * tests/database/test_distributed_runtime_schema.py -- the guard on that DDL.
#   * scripts/ibkr/ + the ibkr extra -- still referenced by an ops playbook.
#
# This list once declared 43 packages including fastapi, uvicorn, psycopg, duckdb,
# polars, snowflake, kubernetes, boto3, azure-*, ortools and nats-py -- the last of
# which outlived NATS itself, deleted from the platform at T5.
dependencies = []

[project.optional-dependencies]
# Only `pytest` survives: the one remaining Python test
# (tests/database/test_distributed_runtime_schema.py) imports `pathlib` and nothing
# else. pytest-asyncio, pytest-mock, moto[s3] and pytest-cov were all left
# unreferenced once the retired platform's tests went -- and moto[s3] alone dragged
# 21 packages (boto3/botocore/cryptography/werkzeug/flask/jinja2/...), which is where
# most of this repo's pip vulnerability surface came from.
dev = ["pytest>=8.1.1"]
publish = ["build>=1.2.2.post1", "twine>=6.1.0", "maturin>=1.0,<2.0"]
# The `ibkr` extra is GONE. Its only consumer was scripts/ibkr/authenticate_gateway.py,
# which imported playwright.sync_api to drive a browser login; those scripts were
# removed (noetl/ai-meta#382). The TypeScript suite under tests/playwright/ depends on
# npm `@playwright/test` through its own package.json and is unaffected.

# The NoETL CLI is maintained and released from https://github.com/noetl/cli.
# Do not add Python/PyPI CLI extras here.

[project.urls]
Homepage = "https://noetl.io"
Repository = "https://github.com/noetl/noetl"
Issues = "https://github.com/noetl/noetl/issues"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# `noetl/` is no longer a Python package -- it holds only the SQL DDL above. The
# previous config shipped `noetl*` with package-data "core/ui/**/*", a path deleted
# with the platform.
#
# ⚠ `packages = []` is LOAD-BEARING, not tidiness. .releaserc.json's prepareCmd is
# `uv version <x>`, and uv builds the project to run it. With no packages declared
# and none discoverable, setuptools errors and `uv version` exits 1 -- which would
# fail semantic-release's prepare step and break releases. Declaring an empty
# package list makes the build a well-defined no-op. Verified: exit 0.
[tool.setuptools]
packages = []

[dependency-groups]
dev = ["build>=1.2.2.post1", "twine>=6.1.0"]
