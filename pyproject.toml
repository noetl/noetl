[project]
name = "noetl"
version = "4.26.1"
description = "A framework to build and run data pipelines and workflows."
authors = [
    { name = "Kadyapam", email = "182583029+kadyapam@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "etl",
    "ml",
    "ops",
    "cleansing",
    "data",
    "pipeline",
    "workflow",
    "automation",
]
# ⚠ The Python platform this package shipped has been retired (ai-meta#201).
# noetl/{core,server,worker,tools,outbox,projector} and claim_policy.py are gone;
# the PyPI `noetl` identity is the maturin CLI wheel under packaging/pypi/, which
# has its OWN pyproject.toml and no runtime dependencies at all.
#
# What remains here is noetl/database/ -- schema_ddl.sql, the platform DDL the
# Rust deploy still provisions from (repos/server carries the destination copy;
# see the drift-audit schema-copies check).  It is SQL, not Python.
#
# This list declared 43 packages including fastapi, uvicorn, psycopg, duckdb,
# polars, snowflake, kubernetes, boto3, azure-*, ortools and nats-py -- the last
# of which outlived NATS itself, deleted from the platform at T5.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "moto[s3]>=5.0",
]
publish = ["build>=1.2.2.post1", "twine>=6.1.0", "maturin>=1.0,<2.0"]
# Jupyter/notebook environment and data-viz/science stack
notebook = [
    "jupyterlab>=4.4.3",
    "jupysql>=0.11.1",
    "pandas>=2.2.3",
    "matplotlib>=3.10.3",
]
# Optional helper dependencies for automating IBKR Gateway browser login.
# Note: Playwright also requires: `playwright install chromium`
ibkr = ["playwright>=1.43.0"]

# The NoETL CLI is maintained and released from https://github.com/noetl/cli.
# Do not add Python/PyPI CLI extras here.

[project.urls]
Homepage = "https://noetl.io"
Repository = "https://github.com/noetl/noetl"
Issues = "https://github.com/noetl/noetl/issues"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["noetl*"]

[tool.setuptools.package-data]
# The maintained CLI is released from https://github.com/noetl/cli.
"noetl" = ["core/ui/**/*", "database/ddl/**/*"]

[dependency-groups]
dev = ["build>=1.2.2.post1", "twine>=6.1.0"]
