name: "Build image on Release ⚙️"

# This workflow builds and pushes the GHCR container image on a published
# GitHub Release.
#
# It used to ALSO publish the legacy setuptools `noetl` package to PyPI via a
# `build_push_pip` job (`uv publish`). That job was removed: the PyPI `noetl`
# identity is now owned by the maturin CLI wheel, published exclusively by
# `pypi.yml` on a `pypi-v*` tag (5.0.0+). Leaving the legacy `uv publish` in
# place meant the next GitHub Release would attempt a conflicting upload of the
# setuptools root package to the same PyPI name. Do NOT re-add a PyPI publish
# here — `pypi.yml` is the sole PyPI publisher. See noetl/ai-meta#201.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build_push_image:
    name: build_push_image
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}  

      # Access must be provided on the package level
      # https://github.com/orgs/noetl/packages/container/noetl/settings
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/noetl/dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          # platforms: linux/amd64
          push: true
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=linux/amd64 linux/arm64 image
          # outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=linux/amd64 image
          tags: |
            ghcr.io/noetl/noetl:${{ env.IMAGE_TAG }}
            ghcr.io/noetl/noetl:latest
