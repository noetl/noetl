name: pypi

# Builds the `noetl` PyPI package (the PyO3 wheel over the Rust CLI) on every
# platform in the matrix, and publishes to PyPI when a `pypi-v*` tag is pushed.
#
# Publishing uses the repository's `PYPI_TOKEN` secret — the same token the
# legacy Python package published with, before that publisher was retired. No
# PyPI-side setup is required.
#
# The `verify-release` job gates `publish`.  It exists because
# `twine upload --skip-existing` exits 0 when it skips, and nothing here derives
# the built version from the tag — so a tag cut without bumping
# `packaging/pypi/{pyproject,Cargo}.toml` would build an already-published version,
# skip every file, and report the release green having shipped nothing.
# See noetl/ai-meta#400. A trusted-publishing (OIDC) alternative is included but
# disabled; see the `publish-oidc` job and https://github.com/noetl/ai-meta/issues/201.

on:
  push:
    tags: ["pypi-v*"]
  pull_request:
    paths:
      - "packaging/pypi/**"
      - ".github/workflows/pypi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.platform }}-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Unix only.  The CLI depends on `nix` (POSIX signals + process control
      # for pid/port-forward management), which does not compile on Windows —
      # the native binaries in noetl/cli ship Linux + macOS only for the same
      # reason.  A Windows wheel would need a cfg-gated refactor of those code
      # paths in the CLI first; until then Windows is unsupported and pip falls
      # through to the sdist, which fails to build with the same `nix` error.
      #
      # macOS x86_64 (Intel) is intentionally not in the matrix: the free
      # macos-13 Intel runners are scarce and were wedged in queue for well
      # over 15 minutes during the 5.0.0 release, and the CLI's own native
      # binaries don't ship an Intel-Mac build either.  Intel-Mac users get the
      # sdist, which builds from crates.io in ~3.5 minutes.  Add a
      # `macos-13` / `x86_64` entry back here if a prebuilt Intel wheel is
      # wanted and the runner situation improves.
      matrix:
        include:
          - platform: linux
            target: x86_64
            runner: ubuntu-latest
          - platform: linux
            target: aarch64
            runner: ubuntu-24.04-arm
          - platform: macos
            target: aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # manylinux2014 is the oldest glibc this toolchain targets
          # comfortably.  musllinux is deliberately out of scope for now.
          manylinux: ${{ matrix.platform == 'linux' && '2014' || 'auto' }}
          args: --release --out dist
          sccache: "true"
          working-directory: packaging/pypi

      # The wheel is abi3, so this also proves it imports on a Python far newer
      # than the 3.9 it was built against.
      - name: Verify the wheel installs and runs
        working-directory: packaging/pypi
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .verify
          BIN=".verify/bin"
          [ -d ".verify/Scripts" ] && BIN=".verify/Scripts"
          "${BIN}/pip" install --no-index --find-links dist noetl
          "${BIN}/noetl" --version
          "${BIN}/noetl" --help
          "${BIN}/python" -c "import noetl; print('package', noetl.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: packaging/pypi/dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: packaging/pypi
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packaging/pypi/dist/*.tar.gz

  check:
    name: twine check
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - run: pipx run twine check dist/*

  verify-release:
    name: verify release
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Run the guard's own controls first, on every PR and every tag.  A check
      # that has never produced a failure is indistinguishable from one that
      # cannot, and this one's whole job is to fail rarely.
      - name: The guard can fail (self-test)
        run: python packaging/pypi/ci/verify_release.py --self-test

      # On a tag: the artifact must carry the tag's version AND have something
      # new to upload.  On a pull request there is no tag, so this checks what it
      # can — that pyproject.toml, Cargo.toml and the built filenames agree.
      - name: The release can publish something
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python packaging/pypi/ci/verify_release.py \
              --dist dist --tag "${GITHUB_REF}" --require-new
          else
            echo "not a tag — checking version agreement only"
            python packaging/pypi/ci/verify_release.py --dist dist
          fi

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [check, verify-release]
    if: startsWith(github.ref, 'refs/tags/pypi-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Token-based upload, matching how the legacy Python package published
      # (the retired build_on_release workflow used `uv publish` with the same `PYPI_TOKEN`
      # secret).  The token stays a GitHub secret: `__token__` is PyPI's fixed
      # username for API-token auth, the value is never echoed, and twine never
      # prints it.  `--skip-existing` is kept so a RETRY after a partial upload
      # finishes the job instead of hard-failing — `verify-release` has already
      # established that at least one file is new, so it can no longer launder a
      # whole no-op release into a green run.
      #
      # The output is captured and counted as a BACKSTOP, not as the primary gate:
      # twine exits 0 whether it uploaded or skipped, so its exit code alone says
      # nothing about what shipped.  `verify-release` is the deterministic gate —
      # this catches only the narrow race where PyPI state changed between that job
      # and this one.
      #
      # ⚠ The count must strip terminal control sequences first.  twine writes a
      # progress bar, and in the real 5.1.1 publish log 3 of the 4 upload lines
      # began with an ESC[?25h (cursor-show) sequence rather than with "Uploading".
      # An anchored `^Uploading` matched 1 of 4, and would read 0 — failing a
      # perfectly good release — if twine ever emitted that sequence before the
      # first line too.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/twine.log"
          clean="${RUNNER_TEMP}/twine-clean.log"
          pipx run twine upload --non-interactive --skip-existing dist/* 2>&1 | tee "${raw}"
          sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g' "${raw}" > "${clean}"
          uploaded=$(grep -cE 'Uploading [^ ]+\.(whl|tar\.gz)' "${clean}" || true)
          skipped=$(grep -ciE 'Skipping .* because it appears to already exist' "${clean}" || true)
          echo "── upload accounting"
          echo "  files in dist/ : $(ls dist | wc -l | tr -d ' ')   <- the denominator"
          echo "  uploaded       : ${uploaded}"
          echo "  skipped        : ${skipped}"
          if [ "${uploaded}" -eq 0 ]; then
            echo "::error::twine uploaded 0 files (${skipped} skipped) and still exited 0."
            echo "  This is the noetl/ai-meta#400 failure mode: a release that ships nothing and"
            echo "  reports success.  verify-release should have refused it earlier, so either"
            echo "  PyPI state changed between the two jobs or twine's log wording moved."
            exit 1
          fi

      # Independent of twine's output: ask PyPI what it now serves.  This is what
      # makes the release claim checkable later without trusting a log format.
      - name: PyPI serves the version we just built
        run: |
          set -euo pipefail
          ver=$(python packaging/pypi/ci/verify_release.py --dist dist --print-version)
          want=$(ls dist | wc -l | tr -d " ")
          echo "  expecting PyPI to serve ${want} file(s) for ${ver}"
          got=0
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -sS "https://pypi.org/pypi/noetl/${ver}/json" | python -c "import json,sys; print(len(json.load(sys.stdin).get('urls',[])))" 2>/dev/null || echo 0)
            echo "  attempt ${attempt}: PyPI serves ${got}"
            if [ "${got}" -ge "${want}" ]; then break; fi
            sleep 10
          done
          if [ "${got}" -lt "${want}" ]; then
            echo "::error::PyPI serves ${got} file(s) for ${ver}, expected ${want}."
            exit 1
          fi
          echo "  OK — ${ver} is published with ${got} file(s)"

  # Trusted-publishing (OIDC) alternative, kept disabled.  Flip this on and
  # disable the token `publish` job above if the PyPI project is ever moved to
  # trusted publishing; it needs a `pypi` GitHub environment plus a matching
  # trusted publisher (owner `noetl`, repo `noetl`, workflow `pypi.yml`,
  # environment `pypi`) registered on the PyPI project.  See noetl/ai-meta#201.
  publish-oidc:
    name: publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [check, verify-release]
    if: false
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
