name: pypi

# Builds the `noetl` PyPI package (the PyO3 wheel over the Rust CLI) on every
# platform in the matrix, and publishes to PyPI when a `pypi-v*` tag is pushed.
#
# Publishing uses the repository's `PYPI_TOKEN` secret — the same token the
# legacy Python package published with, before that publisher was retired. No
# PyPI-side setup is required. A trusted-publishing (OIDC) alternative is included but
# disabled; see the `publish-oidc` job and https://github.com/noetl/ai-meta/issues/201.

on:
  push:
    tags: ["pypi-v*"]
  pull_request:
    paths:
      - "packaging/pypi/**"
      - ".github/workflows/pypi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.platform }}-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Unix only.  The CLI depends on `nix` (POSIX signals + process control
      # for pid/port-forward management), which does not compile on Windows —
      # the native binaries in noetl/cli ship Linux + macOS only for the same
      # reason.  A Windows wheel would need a cfg-gated refactor of those code
      # paths in the CLI first; until then Windows is unsupported and pip falls
      # through to the sdist, which fails to build with the same `nix` error.
      #
      # macOS x86_64 (Intel) is intentionally not in the matrix: the free
      # macos-13 Intel runners are scarce and were wedged in queue for well
      # over 15 minutes during the 5.0.0 release, and the CLI's own native
      # binaries don't ship an Intel-Mac build either.  Intel-Mac users get the
      # sdist, which builds from crates.io in ~3.5 minutes.  Add a
      # `macos-13` / `x86_64` entry back here if a prebuilt Intel wheel is
      # wanted and the runner situation improves.
      matrix:
        include:
          - platform: linux
            target: x86_64
            runner: ubuntu-latest
          - platform: linux
            target: aarch64
            runner: ubuntu-24.04-arm
          - platform: macos
            target: aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # manylinux2014 is the oldest glibc this toolchain targets
          # comfortably.  musllinux is deliberately out of scope for now.
          manylinux: ${{ matrix.platform == 'linux' && '2014' || 'auto' }}
          args: --release --out dist
          sccache: "true"
          working-directory: packaging/pypi

      # The wheel is abi3, so this also proves it imports on a Python far newer
      # than the 3.9 it was built against.
      - name: Verify the wheel installs and runs
        working-directory: packaging/pypi
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .verify
          BIN=".verify/bin"
          [ -d ".verify/Scripts" ] && BIN=".verify/Scripts"
          "${BIN}/pip" install --no-index --find-links dist noetl
          "${BIN}/noetl" --version
          "${BIN}/noetl" --help
          "${BIN}/python" -c "import noetl; print('package', noetl.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: packaging/pypi/dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: packaging/pypi
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packaging/pypi/dist/*.tar.gz

  check:
    name: twine check
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - run: pipx run twine check dist/*

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/pypi-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Token-based upload, matching how the legacy Python package published
      # (the retired build_on_release workflow used `uv publish` with the same `PYPI_TOKEN`
      # secret).  The token stays a GitHub secret: `__token__` is PyPI's fixed
      # username for API-token auth, the value is never echoed, and twine never
      # prints it.  `--skip-existing` makes a re-run of an already-uploaded
      # version a no-op instead of a hard failure.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: pipx run twine upload --non-interactive --skip-existing dist/*

  # Trusted-publishing (OIDC) alternative, kept disabled.  Flip this on and
  # disable the token `publish` job above if the PyPI project is ever moved to
  # trusted publishing; it needs a `pypi` GitHub environment plus a matching
  # trusted publisher (owner `noetl`, repo `noetl`, workflow `pypi.yml`,
  # environment `pypi`) registered on the PyPI project.  See noetl/ai-meta#201.
  publish-oidc:
    name: publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [check]
    if: false
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
